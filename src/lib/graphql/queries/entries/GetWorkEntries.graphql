query GetWorkEntries(
  $site: [String] = ["davidhellmann_en"]
  $section: [String]! = ["work"]
  $limit: Int = 100
  $offset: Int = 0
  $slug: [String]
  $orderBy: String = "postDate DESC"
  $fullContent: Boolean! = true
) {
  entries(
    site: $site,
    section: $section,
    limit: $limit,
    offset: $offset,
    slug: $slug,
    orderBy: $orderBy
  ) {
    ...page_workSingle
  }
  entryCount(
    site: $site,
    section: $section
    slug: $slug
  )
}
